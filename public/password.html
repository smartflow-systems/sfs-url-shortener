<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protected Link — SFS URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #FFD700;
      --black: #0D0D0D;
      --surface: #1a1410;
      --border: rgba(255,215,0,0.2);
      --text: #f0e8d8;
      --text-dim: #a0937e;
    }
    body {
      background: var(--black);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .lock { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.4rem; }
    p  { color: var(--text-dim); font-size: 0.875rem; margin-bottom: 1.5rem; }
    input[type="password"] {
      width: 100%;
      background: var(--black);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 0.7rem 1rem;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--gold); }
    button {
      width: 100%;
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.7rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #ffe44d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #error { color: #ff6b6b; font-size: 0.85rem; margin-top: 0.75rem; display: none; }
    .logo { color: var(--gold); font-weight: 700; font-size: 0.85rem; margin-bottom: 1.5rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SFS URL Shortener</div>
    <div class="lock">🔒</div>
    <h1>Password Required</h1>
    <p>This link is protected. Enter the password to continue.</p>
    <input type="password" id="pw" placeholder="Enter password" autofocus />
    <button id="btn">Unlock &amp; Go</button>
    <div id="error"></div>
  </div>

  <script>
    const code = location.pathname.replace(/^\//, "");
    const btn  = document.getElementById("btn");
    const pw   = document.getElementById("pw");
    const err  = document.getElementById("error");

    async function verify() {
      const password = pw.value;
      if (!password) return;
      btn.disabled = true;
      err.style.display = "none";
      try {
        const res  = await fetch(`/api/verify/${code}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (data.success) {
          location.href = data.redirect;
        } else {
          err.textContent = data.message || "Incorrect password.";
          err.style.display = "block";
          pw.value = "";
          pw.focus();
        }
      } catch {
        err.textContent = "Request failed. Try again.";
        err.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", verify);
    pw.addEventListener("keydown", e => { if (e.key === "Enter") verify(); });
  </script>
</body>
</html>
