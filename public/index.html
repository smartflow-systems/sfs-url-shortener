<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #d4af37;
    --gold-bright: #FFD700;
    --black: #0b0b0b;
    --surface: #151210;
    --surface2: #1e1810;
    --border: rgba(212,175,55,0.2);
    --text: #f0e8d8;
    --text-dim: #9a8a70;
  }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }

  .container {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .logo-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border: 2px solid var(--gold);
    border-radius: 14px;
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: -0.03em;
    margin-bottom: 1.25rem;
    background: var(--surface);
  }

  h1 {
    font-size: 1.55rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--gold); }

  .tagline {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 2.25rem;
    line-height: 1.5;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    background: var(--surface);
    color: var(--text);
    padding: 1rem 1.25rem;
    text-decoration: none;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 0.95rem;
    font-weight: 600;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    text-align: left;
  }

  .btn:hover {
    border-color: var(--gold);
    background: var(--surface2);
    color: var(--gold);
  }

  .btn .icon {
    font-size: 1.15rem;
    flex-shrink: 0;
    width: 1.5rem;
    text-align: center;
  }

  .btn .label {
    flex: 1;
  }

  .btn .arrow {
    color: var(--text-dim);
    font-size: 0.85rem;
    flex-shrink: 0;
    transition: color 0.15s;
  }

  .btn:hover .arrow { color: var(--gold); }

  .footer {
    color: var(--text-dim);
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
    padding-top: 1.25rem;
  }

  .footer a {
    color: var(--text-dim);
    text-decoration: none;
  }

  .footer a:hover { color: var(--gold); }

  @media (min-width: 480px) {
    h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo-mark">SF</div>
  <h1>SmartFlow <span>Systems</span></h1>
  <p class="tagline">AI automation that makes you money</p>

  <div class="links">
    <a class="btn" href="/book">
      <span class="icon">📅</span>
      <span class="label">Booking System Demo</span>
      <span class="arrow">→</span>
    </a>
    <a class="btn" href="/ai">
      <span class="icon">🤖</span>
      <span class="label">AI Social Growth Bot</span>
      <span class="arrow">→</span>
    </a>
    <a class="btn" href="/demo">
      <span class="icon">🚀</span>
      <span class="label">View All Systems</span>
      <span class="arrow">→</span>
    </a>
    <a class="btn" href="/contact">
      <span class="icon">📞</span>
      <span class="label">Contact / Get Setup</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="footer">
    <a href="/shorten">URL Shortener</a> &nbsp;·&nbsp; SmartFlow Systems
  </div>
</div>
</body>
</html>
